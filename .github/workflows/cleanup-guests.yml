name: Cleanup guests

# Borra los invitados (usuarios anónimos de Supabase) con más de 30 días y su fila en trainers.
# Requiere el secreto CRON_SECRET en GitHub (Settings → Secrets → Actions) con el mismo
# valor que la variable CRON_SECRET del servicio en Render.
on:
  schedule:
    - cron: "0 14 * * 1" # lunes 14:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo contar, sin borrar"
        type: boolean
        default: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: POST /admin/cleanup-guests
        env:
          URL: https://pokedex-backend-lx85.onrender.com/admin/cleanup-guests
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta el secreto CRON_SECRET en el repositorio"
            exit 1
          fi
          # Render (plan gratuito) puede tardar ~50 s en despertar: reintentos con espera creciente.
          # Solo se reintenta si no hubo respuesta o fue 5xx de arranque; 401/207/500 cortan.
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o response.json -w '%{http_code}' --max-time 120 -X POST \
              -H "X-Cron-Secret: $CRON_SECRET" "$URL?dryRun=$DRY_RUN" || true)
            echo "Intento $attempt: HTTP $status $(cat response.json 2>/dev/null)"
            case "$status" in
              200) exit 0 ;;
              000|502|503|504) sleep $((attempt * 15)) ;;
              *) echo "::error::La limpieza respondió HTTP $status"; exit 1 ;;
            esac
          done
          echo "::error::$URL no respondió tras 6 intentos"
          exit 1
