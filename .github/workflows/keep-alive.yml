name: Keep alive

# Supabase (plan gratuito) pausa el proyecto tras ~7 días sin actividad.
# Cada 2 días llamamos a /health/ready, que hace una consulta real a la base.
on:
  schedule:
    - cron: "0 13 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health/ready
        env:
          URL: https://pokedex-backend-lx85.onrender.com/health/ready
        run: |
          # Render (plan gratuito) puede tardar ~50 s en despertar: reintentos con espera creciente.
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o response.json -w '%{http_code}' --max-time 90 "$URL" || true)
            echo "Intento $attempt: HTTP $status $(cat response.json 2>/dev/null)"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "::error::$URL no respondió 200 tras 6 intentos"
          exit 1
